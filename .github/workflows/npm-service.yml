---
name: NPM Service

on:
  release:
    types: [published]

# Least-privilege default; the publish job escalates explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Upstream-only, defense in depth: this fork must never run `npm publish`
  # under any circumstance, including an accidental GitHub release on the
  # fork. The gate is a job `if`, not a workflow-level guard, because GitHub
  # Actions has no `if:` on `on:` triggers.
  publish:
    if: github.repository == 'scolladon/apex-mutation-testing'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.channel }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: ./.github/actions/install

      - name: Publish
        id: publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm publish --provenance --access public --tag "latest-rc"
          echo "channel=apex-mutation-testing@$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: [publish]
    if: github.repository == 'scolladon/apex-mutation-testing'
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      channel: ${{ needs.publish.outputs.channel }}
      run-org-e2e: true
    secrets: inherit
